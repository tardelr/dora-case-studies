experiment:
  project: cs7643-dora-lora-quantization
  seed: 43
  output_root: simple/outputs
  run_name_template: '{model_short}-{method}-r{rank}'
  method: dora
  name: meta-llama-3-8b-qdora-r32
  output_dir: simple/outputs/meta-llama-3-8b-qdora-r32
model:
  id: meta-llama/Meta-Llama-3-8B
  torch_dtype: bf16
  device_map: auto
  attn_implementation: sdpa
  trust_remote_code: false
  use_fast_tokenizer: true
  padding_side: left
dataset:
  format: json
  path: https://raw.githubusercontent.com/AGI-Edgerunners/LLM-Adapters/main/ft-training_set/commonsense_170k.json
  split: train
  validation_size: 0
  max_train_examples: null
  seed: 43
adapter:
  rank: 32
  alpha: 64
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - up_proj
  - down_proj
  dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  use_dora: false
quantization:
  enabled: false
  bits: 4
  quant_type: nf4
  double_quant: true
training:
  per_device_train_batch_size: 16
  gradient_accumulation_steps: 1
  optim: adamw_torch
  learning_rate: 0.0001
  lr_scheduler_type: linear
  num_train_epochs: 3
  warmup_steps: 100
  logging_steps: 50
  save_steps: 500
  save_total_limit: 3
  save_strategy: steps
  max_steps: -1
  bf16: true
  fp16: false
  max_grad_norm: 1
  max_length: 256
  packing: false
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false
  dataset_text_field: text
  seed: 43
  report_to: tensorboard
  logging_dir: null
  dataloader_num_workers: 0
  resume_from_checkpoint: true
monitoring:
  jsonl_logs: true
  resource_stats:
    enabled: true
    every_n_logs: 1
  analysis_snapshots:
    enabled: true
    fractions:
    - 0.25
    - 0.5
    - 0.75
    save_final: true
  gradient_stats:
    enabled: true
    every_n_steps: 50
eval:
  tasks:
  - boolq
  - piqa
  - social_i_qa
  - hellaswag
  - winogrande
  - ARC-Easy
  - ARC-Challenge
  - openbookqa
  task_url_template: https://raw.githubusercontent.com/AGI-Edgerunners/LLM-Adapters/main/dataset/{task}/test.json
  batch_size: 1
  limit: null
  num_beams: 4
  max_new_tokens: 32
  do_sample: false
  temperature: 0.1
  top_p: 0.75
  top_k: 40
  save_every_n_batches: 1
  adapter_path: null
  allow_base_model_eval: false
